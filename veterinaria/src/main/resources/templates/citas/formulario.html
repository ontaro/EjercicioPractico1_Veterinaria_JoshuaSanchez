
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Nueva cita | Veterinaria Huellitas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body class="bg-light">

        <div th:replace="~{general/fragmentos :: header}"></div>
        <div th:replace="~{general/fragmentos :: navbar}"></div>

        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">
                            <h2 class="h5 mb-0"
                                th:text="${cita.id == null ? 'Registrar nueva cita' : 'Editar cita'}">
                                Registrar nueva cita
                            </h2>
                        </div>

                        <div class="card-body">
                            <form th:action="@{/citas/guardar}"
                                  th:object="${cita}"
                                  method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label for="nombreMascota" class="form-label">
                                        Nombre de la mascota
                                    </label>
                                    <input type="text"
                                           id="nombreMascota"
                                           th:field="*{nombreMascota}"
                                           class="form-control"
                                           maxlength="100"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="nombrePropietario" class="form-label">
                                        Nombre del propietario
                                    </label>
                                    <input type="text"
                                           id="nombrePropietario"
                                           th:field="*{nombrePropietario}"
                                           class="form-control"
                                           maxlength="100"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="fecha" class="form-label">
                                        Fecha de la cita
                                    </label>
                                    <input type="date"
                                           id="fecha"
                                           th:field="*{fecha}"
                                           class="form-control"
                                           th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="servicio" class="form-label">
                                        Servicio veterinario
                                    </label>
                                    <select id="servicio"
                                            th:field="*{servicio.id}"
                                            class="form-select"
                                            required>
                                        <option value="">Seleccione un servicio</option>
                                        <option th:each="servicio : ${servicios}"
                                                th:value="${servicio.id}"
                                                th:text="${servicio.nombre + ' - ₡' + #numbers.formatDecimal(servicio.precio, 1, 2)}">
                                        </option>
                                    </select>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a th:href="@{/citas}"
                                       class="btn btn-secondary">
                                        Cancelar
                                    </a>
                                    <button type="submit"
                                            class="btn btn-success"
                                            th:text="${cita.id == null ? 'Registrar cita' : 'Guardar cambios'}">
                                        Registrar cita
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{general/fragmentos :: footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
