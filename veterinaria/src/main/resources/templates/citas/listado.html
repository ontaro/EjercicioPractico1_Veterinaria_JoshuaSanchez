
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Citas programadas | Veterinaria Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

    <div th:replace="~{general/fragmentos :: header}"></div>
    <div th:replace="~{general/fragmentos :: navbar}"></div>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Citas programadas</h2>
            <a th:href="@{/citas/nuevo}" class="btn btn-success">
                Registrar cita
            </a>
        </div>

        <!-- Mensajes de confirmación -->
        <div th:replace="~{general/fragmentos :: mensajeError}"></div>
        <div th:replace="~{general/fragmentos :: mensajeExito}"></div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>ID</th>
                                <th>Mascota</th>
                                <th>Propietario</th>
                                <th>Fecha</th>
                                <th>Servicio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="cita : ${citas}">
                                <td th:text="${cita.id}"></td>
                                <td th:text="${cita.nombreMascota}"></td>
                                <td th:text="${cita.nombrePropietario}"></td>
                                <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                                <td th:text="${cita.servicio.nombre}"></td>

                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/citas/editar/{id}(id=${cita.id})}"
                                           class="btn btn-sm btn-warning">
                                            Editar
                                        </a>

                                        <form th:action="@{/citas/eliminar/{id}(id=${cita.id})}"
                                              method="post"
                                              onsubmit="return confirm('¿Está seguro de eliminar esta cita?');">
                                            <button type="submit"
                                                    class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(citas)}">
                                <td colspan="6"
                                    class="text-center text-muted py-4">
                                    No hay citas registradas.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{general/fragmentos :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
