
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de servicios | Veterinaria Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

    <div th:replace="~{general/fragmentos :: header}"></div>
    <div th:replace="~{general/fragmentos :: navbar}"></div>

    <main class="container py-4">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h2 class="h4 mb-0"
                            th:text="${servicio.id == null ? 'Registrar servicio' : 'Editar servicio'}">
                            Registrar servicio
                        </h2>
                    </div>

                    <div class="card-body">

                        <form th:action="@{/servicios/guardar}"
                              th:object="${servicio}"
                              method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre del servicio
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       maxlength="100"
                                       required
                                       placeholder="Ej. Consulta general">
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label">
                                    Precio (₡)
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="precio"
                                       th:field="*{precio}"
                                       min="0.01"
                                       step="0.01"
                                       required
                                       placeholder="Ej. 15000.00">
                            </div>

                            <div class="mb-3">
                                <label for="duracionMinutos" class="form-label">
                                    Duración (minutos)
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="duracionMinutos"
                                       th:field="*{duracionMinutos}"
                                       min="1"
                                       step="1"
                                       required
                                       placeholder="Ej. 30">
                            </div>

                            <div class="mb-4">
                                <label for="tipoServicio" class="form-label">
                                    Tipo de servicio
                                </label>
                                <select class="form-select"
                                        id="tipoServicio"
                                        th:field="*{tipoServicio.id}"
                                        required>
                                    <option value="">Seleccione un tipo de servicio</option>
                                    <option th:each="tipo : ${tiposServicio}"
                                            th:value="${tipo.id}"
                                            th:text="${tipo.nombre}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/servicios}"
                                   class="btn btn-secondary">
                                    Regresar
                                </a>

                                <button type="submit" class="btn btn-success">
                                    Guardar servicio
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <div th:replace="~{general/fragmentos :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
