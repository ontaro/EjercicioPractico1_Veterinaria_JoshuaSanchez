
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servicios veterinarios | Veterinaria Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

    <div th:replace="~{general/fragmentos :: header}"></div>
    <div th:replace="~{general/fragmentos :: navbar}"></div>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Servicios veterinarios</h2>
            <a th:href="@{/servicios/nuevo}" class="btn btn-success">
                Nuevo servicio
            </a>
        </div>

        <div th:replace="~{general/fragmentos :: mensajeError}"></div>
        <div th:replace="~{general/fragmentos :: mensajeExito}"></div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Tipo de servicio</th>
                                <th>Precio</th>
                                <th>Duración</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="servicio : ${servicios}">
                                <td th:text="${servicio.id}"></td>
                                <td th:text="${servicio.nombre}"></td>
                                <td th:text="${servicio.tipoServicio.nombre}"></td>
                                <td th:text="${#numbers.formatDecimal(servicio.precio, 1, 2)}"></td>
                                <td>
                                    <span th:text="${servicio.duracionMinutos}"></span>
                                    min
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/servicios/editar/{id}(id=${servicio.id})}"
                                       class="btn btn-sm btn-warning">
                                        Editar
                                    </a>

                                    <form th:action="@{/servicios/eliminar/{id}(id=${servicio.id})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar este servicio?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(servicios)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No hay servicios registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <div th:replace="~{general/fragmentos :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
