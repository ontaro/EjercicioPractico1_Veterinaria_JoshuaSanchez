<section>
    <div class="d-flex justify-content-between mb-3">
        <h2>Tipos de servicio</h2>
        <a th:href="@{/tiposervicio/nuevo}"
           class="btn btn-success">
            Nuevo tipo
        </a>
    </div>

    <div th:if="${mensaje}"
         class="alert alert-success"
         th:text="${mensaje}">
    </div>

    <table class="table table-striped table-hover bg-white">
        <thead class="table-success">
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Cantidad de servicios</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="tipo : ${tipos}">
            <td th:text="${tipo.nombre}"></td>
            <td th:text="${tipo.descripcion}"></td>
            <td th:text="${tipo.servicios.size()}"></td>
            <td>
                <a th:href="@{/tiposervicio/editar/{id}(id=${tipo.id})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <button type="button"
                        class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#modal' + ${tipo.id}">
                    Eliminar
                </button>

                <div class="modal fade"
                     th:id="'modal' + ${tipo.id}"
                     tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Confirmar eliminación
                                </h5>
                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">
                                ¿Desea eliminar el tipo
                                <strong th:text="${tipo.nombre}"></strong>?
                            </div>

                            <div class="modal-footer">
                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <form th:action="@{/tiposervicio/eliminar/{id}(id=${tipo.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-danger">
                                        Confirmar eliminación
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</section>
