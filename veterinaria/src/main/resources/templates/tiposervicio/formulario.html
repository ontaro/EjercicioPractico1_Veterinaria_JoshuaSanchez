
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tipos de servicio - Veterinaria Huellitas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

    <div th:replace="~{general/fragmentos :: header}"></div>
    <div th:replace="~{general/fragmentos :: navbar}"></div>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h4 mb-0"
                            th:text="${tipoServicio.id == null
                            ? 'Registrar tipo de servicio'
                            : 'Editar tipo de servicio'}">
                            Registrar tipo de servicio
                        </h2>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/tiposervicio/guardar}"
                              th:object="${tipoServicio}"
                              method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>
                                <input type="text"
                                       id="nombre"
                                       class="form-control"
                                       th:field="*{nombre}"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">
                                    Descripción
                                </label>
                                <textarea id="descripcion"
                                          class="form-control"
                                          th:field="*{descripcion}"
                                          maxlength="255"
                                          rows="3"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">
                                    Guardar
                                </button>

                                <a th:href="@{/tiposervicio}"
                                   class="btn btn-secondary">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{general/fragmentos :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
